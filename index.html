<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mushak Dash | Vinayaka Chaturthi 2D Runner</title>
    <meta name="description" content="Help Mushak collect modaks and festive offerings across vibrant streets in this 2D endless runner browser game for Vinayaka Chaturthi!" />
    
    <!-- Google Fonts for Festive Anime Arcade Aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      window.onerror = function(msg, url, line, col, err) {
        if (!url || url.includes('chrome-extension') || url.includes('moz-extension')) return;
        console.error('[Global Error]', msg, url, line, err);
      };
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason || '');
        // Ignore known third-party browser extension / canvas context inspection errors
        if (reason.includes('drawImage') || reason.includes('Extension') || reason.includes('ResizeObserver')) {
          console.warn('[Ignored external rejection]:', reason);
          return;
        }
        console.error('[Unhandled Promise Rejection]:', e.reason);
      });
    </script>
  </head>
  <body>
    <div id="app-container">
      <div id="game-container"></div>
      
      <!-- Fullscreen Toggle Button -->
      <button id="btn-fullscreen" aria-label="Toggle Fullscreen" title="Toggle Fullscreen">⛶</button>

      <!-- Mobile Portrait Orientation Suggestion Pill -->
      <div id="rotate-hint">
        <span>🔄 Rotate for wide screen</span>
        <button id="btn-dismiss-rotate" aria-label="Dismiss">✕</button>
      </div>

      <!-- Mobile Quick Touch Controls (Shown during gameplay) -->
      <div id="touch-controls" class="touch-controls">
        <div class="touch-col">
          <button id="btn-up" class="touch-btn" aria-label="Switch Track Up">▲</button>
          <button id="btn-down" class="touch-btn" aria-label="Switch Track Down">▼</button>
        </div>
        <button id="btn-jump" class="touch-btn jump-btn" aria-label="Jump Obstacle">⚡ JUMP</button>
      </div>

      <!-- Player Profile Setup Modal (First launch & Profile editing) -->
      <div id="profile-modal" class="modal-backdrop">
        <div class="modal-card">
          <div class="modal-header">
            <span class="modal-badge">✨ FESTIVAL RUNNER ENTRY ✨</span>
            <h2 class="modal-title">REGISTER MUSHAK RUNNER</h2>
            <p class="modal-subtitle">Set your unique Player ID for the live leaderboard</p>
            <button type="button" id="btn-close-modal" class="modal-close-btn" aria-label="Close">✕</button>
          </div>
          <form id="profile-form">
            <div class="form-group">
              <label for="input-player-name">Player ID / Name</label>
              <input type="text" id="input-player-name" maxlength="25" placeholder="e.g. MushakRider" autocomplete="off" />
            </div>
            <div class="modal-actions">
              <button type="submit" id="btn-save-profile" class="modal-btn-primary">SAVE & CONTINUE</button>
              <button type="button" id="btn-cancel-modal" class="modal-btn-secondary">SKIP / PLAY AS GUEST</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
    <script>
      // Fullscreen handling
      var fsBtn = document.getElementById('btn-fullscreen');
      if (fsBtn) {
        fsBtn.addEventListener('click', function() {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(function() {});
            fsBtn.textContent = '🗗';
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen().catch(function() {});
              fsBtn.textContent = '⛶';
            }
          }
        });
      }

      // Rotate hint handling
      var rotateHint = document.getElementById('rotate-hint');
      var dismissRotate = document.getElementById('btn-dismiss-rotate');
      var isMobileDevice = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || ('ontouchstart' in window && window.innerWidth < 800);
      
      function checkOrientation() {
        if (!rotateHint) return;
        if (isMobileDevice && window.innerHeight > window.innerWidth && !sessionStorage.getItem('dismiss_rotate')) {
          rotateHint.classList.add('show');
        } else {
          rotateHint.classList.remove('show');
        }
      }

      if (dismissRotate) {
        dismissRotate.addEventListener('click', function(e) {
          e.stopPropagation();
          sessionStorage.setItem('dismiss_rotate', 'true');
          if (rotateHint) rotateHint.classList.remove('show');
        });
      }

      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', checkOrientation);
      checkOrientation();
    </script>
  </body>
</html>
